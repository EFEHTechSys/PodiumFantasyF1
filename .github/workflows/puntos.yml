name: Calcular Puntos EFEH Tech

on:
  workflow_dispatch: # Te permite seguir disparándolo manualmente cuando lo necesites
  schedule:
    # Se ejecuta cada 3 horas los domingos (0) y lunes (1), 
    # EXCLUSIVAMENTE durante los meses de temporada activa: de marzo (3) a diciembre (12).
    - cron: '0 */3 * 3-12 0,1'

jobs:
  run-logic:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio (rama logyc)
        uses: actions/checkout@v4
        with:
          ref: 'logyc'

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install supabase pandas requests

      - name: Ejecutar motor de puntos
        run: python points_logic.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
